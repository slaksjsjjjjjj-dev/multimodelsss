name: SIDERAL CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências mínimas para testes dos coletores
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31"
      - name: Instalar dependências do runner Click-to-Point
        run: python -m pip install "numpy>=1.26,<3" "requests>=2.31"
      - name: Validar expansão e inicialização do runner Skew-T
        run: python .github/scripts/global_nwp_skewt_clickpoint.py --help
      - name: Testar perfis convencionais GFS, ICON/DWD e ECMWF IFS
        run: python -m unittest discover -s tests -p "test_global_skewt_sampling.py" -v
      - name: Validar sintaxe dos coletores e publicadores NWP
        run: |
          set -euo pipefail
          python -m py_compile \
            global-nwp/collect.py \
            global-nwp/publish_tree.py \
            global-nwp/publish_release.py \
            global-nwp/publish_multimodels.py
      - name: Testar adaptadores, horários NOAA e integridade GRIB
        run: python -m unittest discover -s global-nwp/tests -v
      - name: Conferir arquivos de catálogo JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          for name in ("catalog.json", "regions.json"):
              path = Path("global-nwp") / name
              with path.open(encoding="utf-8") as stream:
                  json.load(stream)
              print(f"OK: {path}")
          PY
