# SIDERAL MULTIMODELS 0.5 — workflow YAML único, com correção do horizonte nativo do ICON
# e correção do lat/lon da grade icosaédrica nativa do ICON (CLAT/CLON).
# Este é o ÚNICO arquivo que precisa ser enviado ao repositório GitHub.
# O motor (Python/configuração/testes) está embutido como pacote comprimido e é
# reconstruído apenas dentro do runner temporário. YAML orquestra os passos;
# a decodificação GRIB2, interpolação e cálculos meteorológicos continuam sendo
# executados pelo motor Python, pois Actions YAML não implementa essas operações.
# Modelos: ECMWF IFS Open Data, NOAA GFS e DWD ICON Global. Grade global: 0,5°.
# Saída: frames PNG/JSON a cada hora entre os leads nativos; os interpolados são identificados.
# tp6h é acumulado em 6 h e não recebe valores artificiais nos horários intermediários.
# Fix 1: o downloader ICON ignora leads acima do horizonte nativo (ex.: F126 quando o ciclo termina em F120).
# Fix 2: o ICON Global é publicado em grade icosaédrica (não estruturada); o GRIB2 de cada
#        campo não traz lat/lon, então o motor agora baixa as coordenadas nativas CLAT/CLON
#        (uma vez por rodada) e as usa para regrade por vizinho mais próximo, evitando o erro
#        "Nenhuma variável reconhecida em f000.grib2".
# Configure o arquivo em .github/workflows/multimodels-05.yml.

name: SIDERAL MULTIMODELS 0.5 - YAML único

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Data UTC YYYYMMDD; vazio = seleção automática"
        required: false
        type: string
      run_cycle:
        description: "Ciclo UTC 00, 06, 12 ou 18; vazio = seleção automática"
        required: false
        type: string
      forecast_hours:
        description: "Horas separadas por vírgula; padrão 0,6,...,168"
        required: false
        default: "0,6,12,18,24,30,36,42,48,54,60,66,72,78,84,90,96,102,108,114,120,126,132,138,144,150,156,162,168"
        type: string
  schedule:
    - cron: "15 1,13 * * *"

permissions:
  contents: read

concurrency:
  group: sideral-multimodels-05
  cancel-in-progress: false

jobs:
  multimodels:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    env:
      GFS_REQUEST_DELAY_SECONDS: "10"
      LOG_LEVEL: INFO
    steps:
      - name: Checkout do repositório (contém apenas este YAML)
        uses: actions/checkout@v4

      - name: "Motor embutido — parte 1/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part01.b64 <<'SIDERAL_PAYLOAD_1'
          
          SIDERAL_PAYLOAD_1
      - name: "Motor embutido — parte 2/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part02.b64 <<'SIDERAL_PAYLOAD_2'
          
          SIDERAL_PAYLOAD_2
      - name: "Motor embutido — parte 3/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part03.b64 <<'SIDERAL_PAYLOAD_3'
          
          SIDERAL_PAYLOAD_3
      - name: "Motor embutido — parte 4/4"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .sideral_embedded
          cat > .sideral_embedded/part04.b64 <<'SIDERAL_PAYLOAD_4'
          
          SIDERAL_PAYLOAD_4
      - name: Reconstruir os arquivos do motor dentro do runner
        shell: bash
        run: |
          set -euo pipefail
          cat .sideral_embedded/part*.b64 > .sideral_embedded/engine.b64
          base64 --decode .sideral_embedded/engine.b64 > .sideral_embedded/engine.zip
          unzip -q .sideral_embedded/engine.zip -d .
          test -s sideral-multimodels-05/config.yml
          test -s sideral-multimodels-05/src/sideral_multimodels/processing.py
          echo "Motor reconstruído com sucesso. O repositório continua contendo somente YAML."

      - name: Preparar bibliotecas de GRIB2
        run: |
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-tools

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências do motor embutido
        working-directory: sideral-multimodels-05
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"

      - name: Testes unitários
        working-directory: sideral-multimodels-05
        env:
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Executar download, grade de 0,5° e consenso
        working-directory: sideral-multimodels-05
        env:
          PYTHONPATH: src
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          FORECAST_HOURS: ${{ inputs.forecast_hours }}
        shell: bash
        run: |
          set -euo pipefail
          python -m sideral_multimodels run \
            --config config.yml \
            --date "${RUN_DATE:-}" \
            --cycle "${RUN_CYCLE:-}" \
            --hours "${FORECAST_HOURS:-}" \
            --raw-dir data/raw \
            --output-dir output

      - name: Validar continuidade dos frames PNG/JSON
        working-directory: sideral-multimodels-05
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          output = Path("output")
          manifests = sorted(output.glob("*/manifest.json"))
          if not manifests:
              raise SystemExit("ERRO: nenhum manifest.json de rodada foi gerado")

          for manifest_path in manifests:
              run_dir = manifest_path.parent
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
              hours = manifest.get("productForecastHours", manifest.get("forecastHours", []))
              products = manifest.get("forecastProducts", [])
              if not hours:
                  raise SystemExit(f"ERRO: forecastHours vazio em {manifest_path}")
              expected = list(range(int(hours[0]), int(hours[-1]) + 1))
              if [int(hour) for hour in hours] != expected:
                  raise SystemExit(f"ERRO: manifest contém lacunas em {manifest_path}")
              product_hours = [int(item["forecastHour"]) for item in products]
              if product_hours != expected:
                  raise SystemExit(f"ERRO: lista de produtos não é contínua em {manifest_path}")

              missing = []
              for lead in expected:
                  for suffix in ("png", "json"):
                      product_path = run_dir / "forecast" / f"f{lead:03d}.{suffix}"
                      if not product_path.is_file() or product_path.stat().st_size == 0:
                          missing.append(str(product_path))
              if missing:
                  raise SystemExit("ERRO: frames ausentes: " + ", ".join(missing[:30]))
              print(f"OK: {run_dir.name}: {len(expected)} leads contínuos, cada um com PNG e JSON.")
          PY

      - name: Publicar artefato multimodelo
        uses: actions/upload-artifact@v4
        with:
          name: sideral-multimodels-05-${{ github.run_id }}
          path: sideral-multimodels-05/output/
          if-no-files-found: error
          retention-days: 14

