name: WRF CBR 4 km — Click-to-Point Skew-T

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude do ponto selecionado no mapa
        required: true
        type: string
      longitude:
        description: Longitude do ponto selecionado no mapa
        required: true
        type: string
      request_id:
        description: UUID hexadecimal de 32 caracteres criado pelo Render
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  clickpoint:
    uses: ./.github/workflows/wrf-skewt-clickpoint-reusable.yml
    with:
      latitude: ${{ inputs.latitude }}
      longitude: ${{ inputs.longitude }}
      request_id: ${{ inputs.request_id }}
      model_key: "cbr_wrf_4km"
      model_label: "WRF CBR 4 km"
      resolution_km: 4
      data_branch: "cbr-json-data"
      checkpoint_prefix: "cbr-wrf-4km-checkpoint"
      wrfout_prefix: "cbr-wrfout"
      release_prefix: "cbr-skewt-click"
      max_forecast_hour: 42
