name: SIDERAL — Global NWP JSON Branch

on:
  schedule:
    - cron: "20 9,21 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Data UTC YYYYMMDD; vazio usa a data UTC atual"
        required: false
        type: string
      run_cycle:
        description: "Ciclo UTC"
        required: false
        type: choice
        options: ["auto", "00", "06", "12", "18"]
        default: "auto"

permissions:
  contents: write
  actions: read

concurrency:
  group: sideral-global-nwp-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  collect:
    name: "Coletar ${{ matrix.model }}"
    concurrency:
      group: sideral-global-nwp-collect-${{ github.ref }}-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model:
          # Interleave providers so one slow ECMWF batch cannot occupy the
          # entire matrix before DWD, NOAA and ECCC get a runner.
          - ecmwf_ifs
          - icon_dwd
          - gfs
          - cmc_gdps
          - ecmwf_eps
          - icon_ai
          - gfs_ai
          - cmc_geps
          - ecmwf_aifs
          - gefs_ai
          - ecmwf_aifs_ens
          - hgefs
          - ukmet
    steps:
      - name: Checkout multimodelsss
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas GRIB e Python
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip wheel setuptools

      - name: Preparar CDO e pesos oficiais de regrade ICON
        if: ${{ matrix.model == 'icon_dwd' || matrix.model == 'icon_ai' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get install -y cdo
          mkdir -p .cache/icon-regrid
          curl -fL --retry 4 --retry-delay 3 \
            https://opendata.dwd.de/weather/lib/cdo/ICON_GLOBAL2WORLD_025_EASY.tar.bz2 \
            -o /tmp/ICON_GLOBAL2WORLD_025_EASY.tar.bz2
          tar -xjf /tmp/ICON_GLOBAL2WORLD_025_EASY.tar.bz2 \
            -C .cache/icon-regrid --wildcards \
            '*target_grid_world_025.txt' '*weights_icogl2world_025.nc'
          test -n "$(find .cache/icon-regrid -name target_grid_world_025.txt -print -quit)"
          test -n "$(find .cache/icon-regrid -name weights_icogl2world_025.nc -print -quit)"
          cdo -V | head -n 2
          python -m pip install \
            "herbie-data>=2026.10.0" \
            "ecmwf-opendata>=0.3.0" \
            "dwdopen>=1.0.0" \
            "eccodes>=2.42.0" \
            "numpy>=1.26,<3" \
            "requests>=2.31"

      - name: Coletar todas as variáveis/níveis e validades publicadas
        id: collect
        timeout-minutes: 340
        continue-on-error: true
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          ICON_REGRID_DIR: .cache/icon-regrid
        shell: bash
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi
          if [[ -n "${RUN_CYCLE:-}" && "$RUN_CYCLE" != "auto" ]]; then CYCLE_ARG=(--cycle "$RUN_CYCLE"); fi
          python global-nwp/collect.py \
            --model "$MODEL_KEY" \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}" \
            --output-dir global-nwp-output

      - name: Registrar resultado do modelo no resumo do job
        if: always()
        shell: bash
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          mkdir -p global-nwp-output/"$MODEL_KEY"
          STATUS=global-nwp-output/"$MODEL_KEY"/model_status.json
          PROGRESS=global-nwp-output/"$MODEL_KEY"/collection-progress.json
          if [[ ! -f "$STATUS" ]]; then
            printf '{"model_key":"%s","status":"failed","message":"Coletor interrompido antes de escrever model_status.json; consulte collection-progress.json."}\n' "$MODEL_KEY" > "$STATUS"
          fi
          python - "$STATUS" "$PROGRESS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          status=json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"### {status.get('model_key')} — {status.get('status')}")
          print(status.get("message", ""))
          progress_path=pathlib.Path(sys.argv[2])
          if progress_path.is_file():
              progress=json.load(progress_path.open(encoding="utf-8"))
              print(
                  f"\n**Progresso:** {progress.get('completed_count', 0)}/"
                  f"{progress.get('requested_forecast_hours', 0)} validades concluídas."
              )
              print(f"**Com arquivo:** {len(progress.get('available_forecast_hours', []))}")
              print(f"**Sem arquivo:** {progress.get('missing_forecast_hours', [])[:40]}")
              errors=progress.get("errors", [])
              if errors:
                  print("\n**Falhas de download/processamento (até 20):**")
                  for item in errors[:20]:
                      print(f"- {item}")
          if status.get("errors"):
              print("\n**Ocorrências finais:**")
              for item in status["errors"][:20]:
                  print(f"- {item}")
          PY

      - name: Enviar dados regionais para o agregador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-nwp-${{ matrix.model }}
          path: global-nwp-output/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 1

  publish:
    name: Publicar JSONs na branch nwp-data
    if: ${{ always() }}
    needs: [collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout multimodelsss
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Baixar resultados de todos os modelos
        uses: actions/download-artifact@v4
        with:
          pattern: global-nwp-*
          path: release-input
          merge-multiple: false

      - name: Preparar JSONs individuais por modelo e região
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi
          if [[ -n "${RUN_CYCLE:-}" && "$RUN_CYCLE" != "auto" ]]; then CYCLE_ARG=(--cycle "$RUN_CYCLE"); fi
          python global-nwp/publish_release.py \
            --input release-input \
            --output release-assets \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}"

      - name: Publicar JSONs individuais na árvore nwp-data
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python global-nwp/publish_tree.py \
            --source release-assets \
            --branch nwp-data \
            --repository "$GH_REPO" \
            --token "$GH_TOKEN" \
            --commit-message "Publish Sideral global NWP ${GITHUB_RUN_ID}" \
            --batch-mb 8 \
            --batch-files 200
          echo "Dados: https://github.com/$GH_REPO/tree/nwp-data/data" >> "$GITHUB_STEP_SUMMARY"
          echo "Catálogo: https://github.com/$GH_REPO/blob/nwp-data/catalog.json" >> "$GITHUB_STEP_SUMMARY"
          echo "Relatório: https://github.com/$GH_REPO/blob/nwp-data/run-report.json" >> "$GITHUB_STEP_SUMMARY"

