name: SIDERAL — Global NWP JSON Releases

on:
  schedule:
    - cron: "20 9,21 * * *"
  workflow_dispatch:
    inputs:
      run_date:
        description: "Data UTC YYYYMMDD; vazio usa a data UTC atual"
        required: false
        type: string
      run_cycle:
        description: "Ciclo UTC"
        required: false
        type: choice
        options: ["auto", "00", "06", "12", "18"]
        default: "auto"

permissions:
  contents: write
  actions: read

jobs:
  collect:
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    name: "Coletar ${{ matrix.model }}"
    concurrency:
      group: sideral-global-nwp-collect-${{ github.ref }}-${{ matrix.model }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        model:
          # Interleave providers so one slow ECMWF batch cannot occupy the
          # entire matrix before DWD, NOAA and ECCC get a runner.
          - ecmwf_ifs
          - icon_dwd
          - gfs
          - cmc_gdps
          - ecmwf_eps
          - icon_ai
          - gfs_ai
          - cmc_geps
          - ecmwf_aifs
          - gefs_ai
          - ecmwf_aifs_ens
          - hgefs
          - ukmet
    steps:
      - name: Checkout multimodelsss
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar bibliotecas GRIB e Python
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libeccodes0 libeccodes-dev
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install \
            "herbie-data>=2026.10.0" \
            "ecmwf-opendata>=0.3.0" \
            "dwdopen>=1.0.0" \
            "eccodes>=2.42.0" \
            "numpy>=1.26,<3" \
            "requests>=2.31"

      - name: Coletar todas as variáveis/níveis e validades publicadas
        id: collect
        timeout-minutes: 320
        continue-on-error: true
        env:
          MODEL_KEY: ${{ matrix.model }}
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
        shell: bash
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi
          if [[ -n "${RUN_CYCLE:-}" && "$RUN_CYCLE" != "auto" ]]; then CYCLE_ARG=(--cycle "$RUN_CYCLE"); fi
          python global-nwp/collect.py \
            --model "$MODEL_KEY" \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}" \
            --output-dir global-nwp-output

      - name: Registrar resultado do modelo no resumo do job
        if: always()
        shell: bash
        env:
          MODEL_KEY: ${{ matrix.model }}
        run: |
          mkdir -p global-nwp-output/"$MODEL_KEY"
          STATUS=global-nwp-output/"$MODEL_KEY"/model_status.json
          PROGRESS=global-nwp-output/"$MODEL_KEY"/collection-progress.json
          if [[ ! -f "$STATUS" ]]; then
            printf '{"model_key":"%s","status":"failed","message":"Coletor interrompido antes de escrever model_status.json; consulte collection-progress.json."}\n' "$MODEL_KEY" > "$STATUS"
          fi
          python - "$STATUS" "$PROGRESS" >> "$GITHUB_STEP_SUMMARY" <<'PY'
          import json, pathlib, sys
          status=json.load(open(sys.argv[1], encoding="utf-8"))
          print(f"### {status.get('model_key')} — {status.get('status')}")
          print(status.get("message", ""))
          progress_path=pathlib.Path(sys.argv[2])
          if progress_path.is_file():
              progress=json.load(progress_path.open(encoding="utf-8"))
              print(
                  f"\n**Progresso:** {progress.get('completed_count', 0)}/"
                  f"{progress.get('requested_forecast_hours', 0)} validades concluídas."
              )
              print(f"**Com arquivo:** {len(progress.get('available_forecast_hours', []))}")
              print(f"**Sem arquivo:** {progress.get('missing_forecast_hours', [])[:40]}")
              errors=progress.get("errors", [])
              if errors:
                  print("\n**Falhas de download/processamento (até 20):**")
                  for item in errors[:20]:
                      print(f"- {item}")
          if status.get("errors"):
              print("\n**Ocorrências finais:**")
              for item in status["errors"][:20]:
                  print(f"- {item}")
          PY

      - name: Enviar dados regionais para o agregador
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: global-nwp-${{ matrix.model }}
          path: global-nwp-output/${{ matrix.model }}/
          if-no-files-found: warn
          retention-days: 2
          compression-level: 1

  publish:
    name: Publicar Releases regionais
    if: ${{ always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    needs: [collect]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout multimodelsss
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Baixar resultados de todos os modelos
        uses: actions/download-artifact@v4
        with:
          pattern: global-nwp-*
          path: release-input
          merge-multiple: false

      - name: Preparar JSONs individuais por modelo e região
        shell: bash
        env:
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
        run: |
          set -euo pipefail
          DATE_ARG=()
          CYCLE_ARG=()
          if [[ -n "${RUN_DATE:-}" ]]; then DATE_ARG=(--date "$RUN_DATE"); fi
          if [[ -n "${RUN_CYCLE:-}" && "$RUN_CYCLE" != "auto" ]]; then CYCLE_ARG=(--cycle "$RUN_CYCLE"); fi
          python global-nwp/publish_release.py \
            --input release-input \
            --output release-assets \
            "${DATE_ARG[@]}" \
            "${CYCLE_ARG[@]}"

      - name: Publicar JSONs individuais na árvore nwp-data
        id: publish_data
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PUBLISH_ROOT="$(mktemp -d)"
          git -C "$PUBLISH_ROOT" init --initial-branch=nwp-data
          git -C "$PUBLISH_ROOT" config user.name "github-actions[bot]"
          git -C "$PUBLISH_ROOT" config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          cp -a release-assets/data "$PUBLISH_ROOT/data"
          cp release-assets/catalog.json "$PUBLISH_ROOT/catalog.json"
          cp release-assets/run-report.json "$PUBLISH_ROOT/run-report.json"
          touch "$PUBLISH_ROOT/.nojekyll"

          git -C "$PUBLISH_ROOT" add -A
          git -C "$PUBLISH_ROOT" commit -m "Publish Sideral JSON data ${GITHUB_RUN_ID}"

          AUTH_HEADER="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git -C "$PUBLISH_ROOT" -c http.extraheader="AUTHORIZATION: basic $AUTH_HEADER" \
            push --force "https://github.com/$GH_REPO.git" HEAD:nwp-data

          echo "JSON directory tree: https://github.com/$GH_REPO/tree/nwp-data/data" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar GitHub Release com JSONs regionais
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_DATE: ${{ inputs.run_date }}
          RUN_CYCLE: ${{ inputs.run_cycle }}
          DATA_PUBLISH_STATUS: ${{ steps.publish_data.outcome }}
        run: |
          set -euo pipefail
          if [[ -n "${RUN_DATE:-}" ]]; then
            DATE_STAMP="$RUN_DATE"
          else
            DATE_STAMP="$(python -c 'from datetime import datetime, timezone, timedelta; print((datetime.now(timezone.utc)-timedelta(hours=9)).strftime("%Y%m%d"))')"
          fi
          if [[ -n "${RUN_CYCLE:-}" && "${RUN_CYCLE:-}" != "auto" ]]; then
            CYCLE_STAMP="$RUN_CYCLE"
          else
            CYCLE_STAMP="$(python -c 'from datetime import datetime, timezone, timedelta; d=datetime.now(timezone.utc)-timedelta(hours=9); print(f"{(d.hour//6)*6:02d}")')"
          fi
          TAG="sideral-global-nwp-${DATE_STAMP}-${CYCLE_STAMP}-${GITHUB_RUN_ID}"
          cat > /tmp/release-notes.md <<EOF
          Publicação Sideral de modelos globais e variantes de IA.

          Os JSONs individuais estão organizados por modelo e região na branch nwp-data:
          data/<modelo>/<regiao>/FNNN.json.gz (um arquivo por validade publicada).
          Cada F contém todos os campos, níveis e membros coletados para aquela
          validade e região. Não há ZIP com os dados meteorológicos.
          Os horários ausentes na origem são informados no manifest.json e no
          run-report.json; nenhum horário é inventado.

          Publicação da árvore nwp-data: ${DATA_PUBLISH_STATUS}
          Dados organizados: https://github.com/${GH_REPO}/tree/nwp-data/data
          Catálogo: https://github.com/${GH_REPO}/blob/nwp-data/catalog.json
          Execução: ${GITHUB_SERVER_URL}/${GH_REPO}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh release create "$TAG" release-assets/catalog.json release-assets/run-report.json \
            --repo "$GH_REPO" \
            --title "Sideral Global NWP — ${DATE_STAMP} ${CYCLE_STAMP}Z" \
            --notes-file /tmp/release-notes.md \
            --latest=false

          echo "Release: https://github.com/${GH_REPO}/releases/tag/${TAG}" >> "$GITHUB_STEP_SUMMARY"
