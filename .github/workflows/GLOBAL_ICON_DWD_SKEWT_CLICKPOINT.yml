name: ICON DWD Skew-T Click-to-Point

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: "Latitude do ponto selecionado"
        required: true
        type: string
      longitude:
        description: "Longitude do ponto selecionado"
        required: true
        type: string
      forecast_hour:
        description: "Validade selecionada no mapa"
        required: true
        type: string
      request_id:
        description: "Identificador de pedido"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: global-skewt-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      MODEL_KEY: "icon_dwd"
      REQUEST_ID: ${{ inputs.request_id }}
      LATITUDE: ${{ inputs.latitude }}
      LONGITUDE: ${{ inputs.longitude }}
      FORECAST_HOUR: ${{ inputs.forecast_hour }}
      OUTPUT_DIR: output
    steps:
      - name: Checkout dos dados e runner
        uses: actions/checkout@v4

      - name: Checkout do renderizador SPC do Sideral
        uses: actions/checkout@v4
        with:
          repository: progames12301-hash/sideral-backend
          ref: main
          path: sideral-backend

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy scipy matplotlib pillow requests
          python -m pip install "git+https://github.com/sharppy/SHARPpy.git@main"

      - name: Gerar perfis de sondagem
        id: generate
        env:
          MPLBACKEND: Agg
        run: |
          python .github/scripts/global_nwp_skewt_clickpoint.py \
            --model-key "$MODEL_KEY" \
            --latitude "$LATITUDE" \
            --longitude "$LONGITUDE" \
            --forecast-hour "$FORECAST_HOUR" \
            --request-id "$REQUEST_ID" \
            --renderer "sideral-backend/tools/skewt/metbr_native_spc_render.py" \
            --output-dir "$OUTPUT_DIR"

      - name: Criar status de erro quando não houver resultado
        if: always()
        run: |
          mkdir -p "$OUTPUT_DIR"
          if [ ! -s "$OUTPUT_DIR/status.json" ]; then
            python -c 'import json,os; p={"status":"failed","request_id":os.environ["REQUEST_ID"],"model_key":os.environ["MODEL_KEY"],"error":"O runner não produziu status.json. Consulte os logs do GitHub Actions."}; open(os.path.join(os.environ["OUTPUT_DIR"],"status.json"),"w",encoding="utf-8").write(json.dumps(p,ensure_ascii=False))'
          fi

      - name: Publicar status, manifesto e imagens
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "icon-dwd-skewt-click-${{ inputs.request_id }}"
          name: "Skew-T ICON DWD · ${{ inputs.request_id }}"
          target_commitish: main
          draft: false
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            output/status.json
            output/manifest.json
            output/f*.png
            output/f*.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
