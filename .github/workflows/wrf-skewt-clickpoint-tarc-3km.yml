name: WRF TARC 3 km — Click-to-Point Skew-T

on:
  workflow_dispatch:
    inputs:
      latitude:
        description: Latitude do ponto selecionado no mapa
        required: true
        type: string
      longitude:
        description: Longitude do ponto selecionado no mapa
        required: true
        type: string
      request_id:
        description: UUID hexadecimal de 32 caracteres criado pelo Render
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  clickpoint:
    uses: ./.github/workflows/wrf-skewt-clickpoint-reusable.yml
    with:
      latitude: ${{ inputs.latitude }}
      longitude: ${{ inputs.longitude }}
      request_id: ${{ inputs.request_id }}
      model_key: "tarc_wrf_3km"
      model_label: "WRF TARC 3 km"
      resolution_km: 3
      data_branch: "tarc-json-data"
      checkpoint_prefix: "tarc-wrf-3km-checkpoint"
      wrfout_prefix: "tarc-wrfout"
      release_prefix: "tarc-skewt-click"
      max_forecast_hour: 48
