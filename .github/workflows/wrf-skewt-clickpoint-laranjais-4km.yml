name: WRF SIDERAL Sudeste 4 km — Skew-T Click-to-Point Laranjais

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/wrf-skewt-clickpoint-laranjais-4km.yml"

permissions:
  contents: write
  actions: read

jobs:
  laranjais:
    uses: ./.github/workflows/wrf-skewt-clickpoint-reusable.yml
    with:
      latitude: "-21.7592"
      longitude: "-42.1703"
      request_id: "a3f81c6d92b74e5c8a10f36d4b7e2c91"
      model_key: "sideral_wrf_4km_sudeste"
      model_label: "WRF SIDERAL Sudeste 4 km — Laranjais (Itaocara/RJ)"
      resolution_km: 4
      data_branch: "sideral-wrf-4km-sudeste-data"
      checkpoint_prefix: "sideral-wrf-4km-sudeste-checkpoint"
      wrfout_prefix: "tarc-wrfout"
      release_prefix: "sideral-4km-sudeste-skewt-laranjais"
      max_forecast_hour: 48
      location_name: "Laranjais"
      location_state: "RJ"
